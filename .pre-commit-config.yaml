repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=3072"]  # Set limit to 3072 KB (3 MB) for displaying images in notebooks

  # https://black.readthedocs.io/en/stable/integrations/source_version_control.html
  # Using this mirror lets us use mypyc-compiled black, which is about 2x faster
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.1
    hooks:
      - id: black
        language_version: python3
        args: [--target-version=py310, --line-length=140]

  - repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
      - id: isort
        exclude: __init__.py
        args: [--profile=black]

  - repo: https://github.com/PyCQA/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
        args:
          - --ignore=E501,W503,E203
          - --max-line-length=140

  - repo: https://github.com/pycqa/pylint
    rev: v4.1.3
    hooks:
      - id: pylint
        exclude: '^(scripts)/'
        args:
          - --disable=attribute-defined-outside-init,import-outside-toplevel,broad-exception-caught,import-error,line-too-long,logging-fstring-interpolation,missing-function-docstring,missing-module-docstring,missing-class-docstring,similarities,too-many-instance-attributes,too-many-arguments

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        args:
          - --install-types
          - --non-interactive
          - --ignore-missing-imports
          - --disallow-untyped-defs
          - --disallow-incomplete-defs
          - --warn-return-any
          - --disallow-any-explicit
        name: mypy
        types: [ python ]
        exclude: '^(scripts)/'
