<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://raw.githubusercontent.com; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>fr-passphrase</title>
  <meta name="description" content="Générateur de passphrase en français selon la méthode Diceware.">
  <link rel="icon" href="favicon.ico">
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    form { display: grid; grid-template-columns: max-content 1fr; gap: .5rem 1rem; align-items: center; justify-items: start; }
    input[type=number], input[type=text] { width: 6rem; }
    button { margin-top: 1rem; padding: .4rem 1rem; }
    #passphrase { font-family: ui-monospace, monospace; font-size: 1.3rem; word-break: break-all; padding: .8rem; background: light-dark(#f3f3f3, #2a2a2a); border-radius: 4px; min-height: 1.5em; user-select: all; }
    small { color: light-dark(#666, #999); }
    header { display: flex; justify-content: space-between; align-items: center; }
    #theme { margin-top: 0; }
  </style>
  <noscript><style>#passphrase, #theme { display: none; }</style></noscript>
  <script>
    if (localStorage.theme) document.documentElement.style.colorScheme = localStorage.theme;
  </script>
</head>
<body>
  <header>
    <h1>fr-passphrase</h1>
    <button id="theme" title="Changer de thème">◐ Auto</button>
  </header>
  <p>Générateur de passphrase en français, selon la méthode <a href="https://fr.wikipedia.org/wiki/Diceware">Diceware</a>.</p>

  <form id="options">
    <label for="words">Nombre de mots</label>
    <input type="number" id="words" min="1" max="20" value="5">
    <label for="separator">Séparateur</label>
    <input type="text" id="separator" value="-" autocomplete="off" spellcheck="false">
    <label for="uppercase">Majuscule</label>
    <input type="checkbox" id="uppercase">
    <label for="digits">Chiffres</label>
    <input type="number" id="digits" min="0" max="10" value="0">
  </form>
  <button id="generate" disabled>Générer</button>
  <button id="copy" disabled>Copier</button>
  <button id="reset">Réinitialiser</button>

  <noscript><p>Cette page a besoin de JavaScript pour générer une passphrase.</p></noscript>
  <p id="passphrase">Chargement de la liste de mots…</p>
  <p id="entropy"></p>

  <p><small><a href="https://github.com/jsdlm/fr-passphrase">Code source</a> · liste de mots <a href="https://github.com/mbelivo/diceware-wordlists-fr">mbelivo/diceware-wordlists-fr</a></small></p>

  <script>
    let wordlist = [];

    function randrange(n) {
      const limit = Math.floor(2 ** 32 / n) * n;
      const buf = new Uint32Array(1);
      do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
      return buf[0] % n;
    }

    function generate() {
      if (!wordlist.length) return;
      const nbWords = Math.min(20, Math.max(1, parseInt(document.getElementById("words").value, 10) || 1));
      const nbDigits = Math.min(10, Math.max(0, parseInt(document.getElementById("digits").value, 10) || 0));
      const uppercase = document.getElementById("uppercase").checked;
      const sep = document.getElementById("separator").value;

      const words = Array.from({ length: nbWords }, () => wordlist[randrange(wordlist.length)]);
      let entropy = nbWords * Math.log2(wordlist.length);

      if (uppercase) {
        const i = randrange(words.length);
        words[i] = words[i].charAt(0).toUpperCase() + words[i].slice(1);
        entropy += Math.log2(words.length);
      }

      if (nbDigits > 0) {
        let number = "";
        for (let i = 0; i < nbDigits; i++) number += randrange(10);
        const nbPositions = words.length + 1;
        words.splice(randrange(nbPositions), 0, number);
        entropy += nbDigits * Math.log2(10) + Math.log2(nbPositions);
      }

      const passphrase = words.join(sep);
      entropy = Math.min(passphrase.length * Math.log2(26), entropy);

      document.getElementById("passphrase").textContent = passphrase;
      document.getElementById("entropy").textContent = `Entropie : ${entropy.toFixed(1)} bits`;
    }

    document.getElementById("generate").addEventListener("click", generate);
    document.getElementById("options").addEventListener("change", generate);
    for (const id of ["words", "digits"]) {
      document.getElementById(id).addEventListener("beforeinput", (event) => {
        const text = event.data ?? event.dataTransfer?.getData("text");
        if (text && /\D/.test(text)) event.preventDefault();
      });
    }
    document.getElementById("reset").addEventListener("click", () => {
      document.getElementById("options").reset();
      generate();
    });
    const THEMES = { auto: "◐ Auto", light: "☀ Clair", dark: "☾ Sombre" };
    const themeButton = document.getElementById("theme");
    function applyTheme(theme) {
      if (theme === "auto") localStorage.removeItem("theme");
      else localStorage.theme = theme;
      document.documentElement.style.colorScheme = theme === "auto" ? "" : theme;
      themeButton.textContent = THEMES[theme];
    }
    applyTheme(localStorage.theme || "auto");
    themeButton.addEventListener("click", () => {
      const order = Object.keys(THEMES);
      applyTheme(order[(order.indexOf(localStorage.theme || "auto") + 1) % order.length]);
    });
    document.getElementById("copy").addEventListener("click", async (event) => {
      const button = event.currentTarget;
      await navigator.clipboard.writeText(document.getElementById("passphrase").textContent);
      button.textContent = "Copié !";
      setTimeout(() => { button.textContent = "Copier"; }, 1000);
    });

    fetch("https://raw.githubusercontent.com/jsdlm/fr-passphrase/main/wordlist.txt")
      .then((r) => {
        if (!r.ok) throw new Error(r.status);
        return r.text();
      })
      .then((text) => {
        wordlist = text.split("\n").map((l) => l.trim()).filter(Boolean).map((l) => l.split(/\s+/).slice(1).join(" "));
        document.getElementById("generate").disabled = false;
        document.getElementById("copy").disabled = false;
        generate();
      })
      .catch(() => {
        document.getElementById("passphrase").textContent = "Impossible de charger la liste de mots.";
      });
  </script>
</body>
</html>
